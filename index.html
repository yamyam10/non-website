<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NON</title>
  <!-- ブラウザのタブ用ファビコン -->
  <link rel="icon" type="image/jpeg" href="S__150183938.jpg">
  <!-- スマホのホーム画面アイコン用 -->
  <link rel="apple-touch-icon" href="S__150183938.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Syne:wght@800;900&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050507;
      --red: #e60012;
      --red-deep: #4a0008;
      --white: #f5f5f7;
      --silver: #9ca3af;
      --font-display: 'Syne', sans-serif;
      --font-impact: 'Anton', sans-serif;
      --font-jp: 'Zen Kaku Gothic New', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      min-height: 100%;
      background-color: var(--bg);
      color: var(--white);
      font-family: var(--font-jp);
      overflow-x: hidden;
      position: relative;
    }

    /* SVGノイズによるテクスチャ */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.035;
      pointer-events: none;
      z-index: 999;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* 赤黒グラデーション背景 */
    .bg-mesh {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: 
        radial-gradient(circle at 85% 15%, rgba(230, 0, 18, 0.45) 0%, transparent 55%),
        radial-gradient(circle at 10% 85%, rgba(74, 0, 8, 0.6) 0%, transparent 60%),
        #050507;
    }

    /* 斜めカッティング */
    .slash-backdrop {
      position: fixed;
      top: 0;
      right: 0;
      width: 48vw;
      height: 100vh;
      background: linear-gradient(135deg, rgba(230, 0, 18, 0.25) 0%, rgba(230, 0, 18, 0.05) 100%);
      clip-path: polygon(25% 0, 100% 0, 100% 100%, 0% 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* 背景巨大文字 (NON) */
    .bg-giant-text {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-8deg);
      font-family: var(--font-impact);
      font-size: clamp(24vw, 30vw, 36vw);
      line-height: 0.8;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.04);
      white-space: nowrap;
      z-index: 1;
      pointer-events: none;
      user-select: none;
    }

    /* 全体コンテナ */
    .app-viewport {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(1.5rem, 4vw, 3.5rem);
      max-width: 1440px;
      margin: 0 auto;
    }

    /* ヘッダー */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 1.2rem;
    }

    .brand-mark {
      display: flex;
      align-items: baseline;
      gap: 0.8rem;
    }

    .brand-jp {
      font-size: clamp(1.4rem, 2.5vw, 2rem);
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .brand-en {
      font-family: var(--font-display);
      font-size: clamp(0.85rem, 1.2vw, 1rem);
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--red);
    }

    .top-badge {
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 2px;
      padding: 0.3rem 0.8rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
    }

    /* メイングリッド */
    .stage-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: clamp(2rem, 5vw, 4.5rem);
      margin: 3.5vh 0;
    }

    /* 左カラム */
    .content-block {
      display: flex;
      flex-direction: column;
      gap: clamp(1.2rem, 2.5vh, 2rem);
    }

    .title-group {
      display: flex;
      flex-direction: column;
    }

    .category-kicker {
      font-family: var(--font-display);
      font-size: clamp(0.8rem, 1.2vw, 0.95rem);
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--red);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
    }

    .main-title {
      font-family: var(--font-impact);
      font-size: clamp(4.2rem, 10vw, 9.5rem);
      line-height: 0.85;
      letter-spacing: -1px;
      text-transform: uppercase;
    }

    .title-jp {
      font-family: var(--font-jp);
      font-weight: 900;
      font-size: 0.48em;
      letter-spacing: 2px;
      display: block;
      margin-bottom: 0.1em;
      color: var(--white);
    }

    .title-en-pill {
      display: inline-block;
      background: var(--white);
      color: var(--bg);
      padding: 0 0.18em;
      transform: skewX(-8deg);
      border-radius: 2px;
    }

    /* 実績リザルトプレート */
    .record-plate {
      background: rgba(14, 14, 18, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: clamp(1.2rem, 3vw, 1.8rem);
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -15px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      position: relative;
      overflow: hidden;
    }

    .record-plate::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--red) 0%, transparent 80%);
    }

    .plate-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
      padding-bottom: 0.8rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .plate-rank {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }

    .rank-prefix {
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--silver);
    }

    .rank-num {
      font-family: var(--font-impact);
      font-size: clamp(2.6rem, 5vw, 3.8rem);
      line-height: 0.85;
      letter-spacing: -1px;
      background: linear-gradient(180deg, #ffffff 30%, #9ca3af 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(255, 255, 255, 0.2));
    }

    .plate-season {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.3rem;
    }

    .badge-silver {
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #000;
      background: #e5e7eb;
      padding: 0.15rem 0.6rem;
      border-radius: 2px;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
    }

    .season-name {
      font-size: 0.95rem;
      font-weight: 900;
      color: var(--white);
    }

    .spec-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .strip-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 900;
    }

    .strip-item .k {
      font-family: var(--font-display);
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.45);
      margin-right: 0.3rem;
      letter-spacing: 1px;
    }

    .strip-item.highlight {
      border-color: var(--red);
      color: #fff;
      background: rgba(230, 0, 18, 0.12);
    }

    .strip-item.highlight .k {
      color: var(--red);
    }

    .deck-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      margin-top: 0.2rem;
    }

    .deck-card {
      background: #08080a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-top: 2px solid var(--red);
      border-radius: 4px;
      padding: 0.6rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      text-align: center;
      transition: transform 0.2s, border-color 0.2s;
    }

    .deck-card:hover {
      transform: translateY(-2px);
      border-color: #fff;
    }

    .c-type {
      font-family: var(--font-display);
      font-size: 0.6rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--red);
    }

    .c-name {
      font-size: clamp(0.85rem, 1.1vw, 1rem);
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.5px;
    }

    /* 右カラム：3Dチルト・キャラクターフレーム */
    .visual-column {
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    .tilt-card {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      position: relative;
      background: var(--bg);
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 
        0 30px 60px -12px rgba(0, 0, 0, 0.85),
        15px 15px 0px rgba(230, 0, 18, 0.9);
      transition: transform 0.1s ease-out, box-shadow 0.25s ease;
      transform-style: preserve-3d;
      overflow: hidden;
      cursor: pointer;
    }

    .tilt-card:hover {
      box-shadow: 
        0 35px 70px -10px rgba(0, 0, 0, 0.95),
        20px 20px 0px var(--white);
    }

    .tilt-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tilt-card:hover img {
      transform: scale(1.04);
    }

    /* フッター */
    footer {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      mix-blend-mode: difference;
    }

    .footer-brand {
      font-family: var(--font-display);
      font-size: clamp(0.9rem, 1.3vw, 1.1rem);
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .social-btn {
      font-family: var(--font-display);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--white);
      text-decoration: none;
      font-size: clamp(0.9rem, 1.3vw, 1.1rem);
      font-weight: 900;
      padding: 0.4rem 1.2rem;
      border: 2px solid var(--white);
      border-radius: 999px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .social-btn:hover {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(230, 0, 18, 0.4);
    }

    /* レスポンシブ調整 */
    @media (max-width: 1024px) {
      .stage-grid {
        grid-template-columns: 1fr;
        gap: 3rem;
        margin: 2.5vh 0;
      }
      .visual-column {
        order: -1;
      }
      .tilt-card {
        max-width: 340px;
        box-shadow: 
          0 25px 45px -10px rgba(0, 0, 0, 0.8),
          12px 12px 0px rgba(230, 0, 18, 0.9);
      }
      .slash-backdrop {
        width: 100vw;
        height: 40vh;
        clip-path: polygon(0 0, 100% 0, 100% 70%, 0% 100%);
      }
    }

    @media (max-width: 480px) {
      .app-viewport {
        padding: 1.2rem;
      }
      .plate-top {
        align-items: flex-start;
      }
      .plate-season {
        align-items: flex-start;
      }
      .deck-row {
        grid-template-columns: repeat(2, 1fr);
      }
      .tilt-card {
        max-width: 280px;
        box-shadow: 
          0 20px 35px -8px rgba(0, 0, 0, 0.8),
          10px 10px 0px var(--red);
      }
      footer {
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <!-- 背景演出 -->
  <div class="bg-mesh"></div>
  <div class="slash-backdrop"></div>
  <div class="bg-giant-text">NON</div>

  <div class="app-viewport">
    
    <!-- ヘッダー -->
    <header>
      <div class="brand-mark">
        <span class="brand-jp">乃夢</span>
        <span class="brand-en">NON</span>
      </div>
      <div class="top-badge">ARCHIVE // RECORD</div>
    </header>

    <!-- メイングリッド -->
    <main class="stage-grid">
      
      <!-- テキスト＆リザルトプレート -->
      <div class="content-block">
        <div class="title-group">
          <div class="category-kicker">COMPASS RECORD</div>
          <h1 class="main-title">
            <span class="title-jp">乃夢</span>
            <span class="title-en-pill">NON</span>
          </h1>
        </div>

        <section class="record-plate">
          <div class="plate-top">
            <div class="plate-rank">
              <span class="rank-prefix">RANK</span>
              <span class="rank-num">#424</span>
            </div>
            <div class="plate-season">
              <span class="badge-silver">SILVER TIER</span>
              <span class="season-name">2024.04「罪と呪い」</span>
            </div>
          </div>

          <div class="spec-strip">
            <div class="strip-item"><span class="k">HERO</span> アインズ</div>
            <div class="strip-item"><span class="k">LV</span> 230</div>
            <div class="strip-item"><span class="k">MEDAL</span> 同色 足3 / 剣6</div>
          </div>

          <div class="deck-row">
            <div class="deck-card">
              <span class="c-type">SHIELD</span>
              <span class="c-name">全天</span>
            </div>
            <div class="deck-card">
              <span class="c-type">STUN</span>
              <span class="c-name">アバカン</span>
            </div>
            <div class="deck-card">
              <span class="c-type">BREAK</span>
              <span class="c-name">シルブレ</span>
            </div>
            <div class="deck-card">
              <span class="c-type">HEAL</span>
              <span class="c-name">赤ガブ</span>
            </div>
          </div>
        </section>
      </div>

      <!-- 3Dチルト・キャラクターフレーム -->
      <div class="visual-column">
        <div class="tilt-card" id="tiltCard">
          <img src="S__150183938.jpg" alt="乃夢 NON" id="charImg">
        </div>
      </div>

    </main>

    <!-- フッター -->
    <footer>
      <div class="footer-brand">&copy; NON (乃夢)</div>
      <a href="https://x.com/Yamu_863" target="_blank" rel="noopener noreferrer" class="social-btn">
        <span>X (@YAMU_863)</span>
      </a>
    </footer>

  </div>

  <!-- 3Dチルト制御スクリプト -->
  <script>
    const card = document.getElementById('tiltCard');
    
    // PC：マウス追従の3D視差傾き
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      
      const rotateX = ((y - centerY) / centerY) * -12;
      const rotateY = ((x - centerX) / centerX) * 12;
      
      card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
    });

    card.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
    });

    // モバイル：タップ時の沈み込み
    card.addEventListener('touchstart', () => {
      card.style.transform = 'perspective(1000px) scale3d(0.96, 0.96, 0.96)';
    }, { passive: true });

    card.addEventListener('touchend', () => {
      card.style.transform = 'perspective(1000px) scale3d(1, 1, 1)';
    }, { passive: true });
  </script>
</body>
</html>
