<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NON</title>
  <meta name="theme-color" content="#08090d">
  <!-- ブラウザのタブ用ファビコン -->
  <link rel="icon" type="image/jpeg" href="S__150183938.jpg">
  <!-- スマホのホーム画面アイコン用 -->
  <link rel="apple-touch-icon" href="S__150183938.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Syne:wght@800;900&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050507;
      --red: #e60012;
      --red-deep: #4a0008;
      --white: #f5f5f7;
      --silver: #9ca3af;
      --font-display: 'Syne', sans-serif;
      --font-impact: 'Anton', sans-serif;
      --font-jp: 'Zen Kaku Gothic New', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      min-height: 100%;
      background-color: var(--bg);
      color: var(--white);
      font-family: var(--font-jp);
      overflow-x: hidden;
      position: relative;
    }

    /* SVGノイズによるテクスチャ */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.035;
      pointer-events: none;
      z-index: 999;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* 赤黒グラデーション背景 */
    .bg-mesh {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: 
        radial-gradient(circle at 85% 15%, rgba(230, 0, 18, 0.45) 0%, transparent 55%),
        radial-gradient(circle at 10% 85%, rgba(74, 0, 8, 0.6) 0%, transparent 60%),
        #050507;
    }

    /* 斜めカッティング */
    .slash-backdrop {
      position: fixed;
      top: 0;
      right: 0;
      width: 48vw;
      height: 100vh;
      background: linear-gradient(135deg, rgba(230, 0, 18, 0.25) 0%, rgba(230, 0, 18, 0.05) 100%);
      clip-path: polygon(25% 0, 100% 0, 100% 100%, 0% 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* 背景巨大文字 (NON) */
    .bg-giant-text {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-8deg);
      font-family: var(--font-impact);
      font-size: clamp(24vw, 30vw, 36vw);
      line-height: 0.8;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.04);
      white-space: nowrap;
      z-index: 1;
      pointer-events: none;
      user-select: none;
    }

    /* 全体コンテナ */
    .app-viewport {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(1.5rem, 4vw, 3.5rem);
      max-width: 1440px;
      margin: 0 auto;
    }

    /* ヘッダー */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 1.2rem;
    }

    .top-badge {
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 2px;
      padding: 0.3rem 0.8rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
    }

    /* メイングリッド */
    .stage-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: clamp(2rem, 5vw, 4.5rem);
      margin: 3.5vh 0;
    }

    /* 左カラム */
    .content-block {
      display: flex;
      flex-direction: column;
      gap: clamp(1.2rem, 2.5vh, 2rem);
    }

    .title-group {
      display: flex;
      flex-direction: column;
    }

    .category-kicker {
      font-family: var(--font-display);
      font-size: clamp(0.8rem, 1.2vw, 0.95rem);
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--red);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
    }

    .main-title {
      font-family: var(--font-impact);
      font-size: clamp(4.2rem, 10vw, 9.5rem);
      line-height: 0.85;
      letter-spacing: -1px;
      text-transform: uppercase;
    }

    .title-jp {
      font-family: var(--font-jp);
      font-weight: 900;
      font-size: 0.48em;
      letter-spacing: 2px;
      display: block;
      margin-bottom: 0.1em;
      color: var(--white);
    }

    .title-en-pill {
      display: inline-block;
      background: var(--white);
      color: var(--bg);
      padding: 0 0.18em;
      transform: skewX(-8deg);
      border-radius: 2px;
    }

    /* 実績リザルトプレート */
    .record-plate {
      background: rgba(14, 14, 18, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: clamp(1.2rem, 3vw, 1.8rem);
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -15px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      position: relative;
      overflow: hidden;
    }

    .record-plate::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--red) 0%, transparent 80%);
    }

    .plate-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
      padding-bottom: 0.8rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .plate-rank {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }

    .rank-prefix {
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--silver);
    }

    .rank-num {
      font-family: var(--font-impact);
      font-size: clamp(2.6rem, 5vw, 3.8rem);
      line-height: 0.85;
      letter-spacing: -1px;
      background: linear-gradient(180deg, #ffffff 30%, #9ca3af 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(255, 255, 255, 0.2));
    }

    .plate-season {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.3rem;
    }

    .badge-silver {
      font-family: var(--font-display);
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #000;
      background: #e5e7eb;
      padding: 0.15rem 0.6rem;
      border-radius: 2px;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
    }

    .season-name {
      font-size: 0.95rem;
      font-weight: 900;
      color: var(--white);
    }

    .spec-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .strip-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 900;
    }

    .strip-item .k {
      font-family: var(--font-display);
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.45);
      margin-right: 0.3rem;
      letter-spacing: 1px;
    }

    .strip-item.highlight {
      border-color: var(--red);
      color: #fff;
      background: rgba(230, 0, 18, 0.12);
    }

    .strip-item.highlight .k {
      color: var(--red);
    }

    .deck-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      margin-top: 0.2rem;
    }

    .deck-card {
      background: #08080a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-top: 2px solid var(--red);
      border-radius: 4px;
      padding: 0.6rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      text-align: center;
      transition: transform 0.2s, border-color 0.2s;
    }

    .deck-card:hover {
      transform: translateY(-2px);
      border-color: #fff;
    }

    .c-type {
      font-family: var(--font-display);
      font-size: 0.6rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--red);
    }

    .c-name {
      font-size: clamp(0.85rem, 1.1vw, 1rem);
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.5px;
    }

    /* 右カラム：3Dチルト・キャラクターフレーム */
    .visual-column {
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    .tilt-card {
      width: 100%;
      max-width: 440px;
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      position: relative;
      background: var(--bg);
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 
        0 30px 60px -12px rgba(0, 0, 0, 0.85),
        15px 15px 0px rgba(230, 0, 18, 0.9);
      transition: transform 0.1s ease-out, box-shadow 0.25s ease;
      transform-style: preserve-3d;
      overflow: hidden;
      cursor: default;
    }

    .tilt-card:hover {
      box-shadow: 
        0 35px 70px -10px rgba(0, 0, 0, 0.95),
        20px 20px 0px var(--white);
    }

    .tilt-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tilt-card:hover img {
      transform: scale(1.04);
    }

    /* フッター */
    footer {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      mix-blend-mode: difference;
    }

    .footer-brand {
      font-family: var(--font-display);
      font-size: clamp(0.9rem, 1.3vw, 1.1rem);
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .social-btn {
      font-family: var(--font-display);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--white);
      text-decoration: none;
      font-size: clamp(0.9rem, 1.3vw, 1.1rem);
      font-weight: 900;
      padding: 0.4rem 1.2rem;
      border: 2px solid var(--white);
      border-radius: 999px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .social-btn:hover {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(230, 0, 18, 0.4);
    }

    /* レスポンシブ調整 */
    @media (max-width: 1024px) {
      .stage-grid {
        grid-template-columns: 1fr;
        gap: 3rem;
        margin: 2.5vh 0;
      }
      .visual-column {
        order: -1;
      }
      .tilt-card {
        max-width: 340px;
        box-shadow: 
          0 25px 45px -10px rgba(0, 0, 0, 0.8),
          12px 12px 0px rgba(230, 0, 18, 0.9);
      }
      .slash-backdrop {
        width: 100vw;
        height: 40vh;
        clip-path: polygon(0 0, 100% 0, 100% 70%, 0% 100%);
      }
    }

    @media (max-width: 480px) {
      .app-viewport {
        padding: 1.2rem;
      }
      .plate-top {
        align-items: flex-start;
      }
      .plate-season {
        align-items: flex-start;
      }
      .deck-row {
        grid-template-columns: repeat(2, 1fr);
      }
      .tilt-card {
        max-width: 280px;
        box-shadow: 
          0 20px 35px -8px rgba(0, 0, 0, 0.8),
          10px 10px 0px var(--red);
      }
      footer {
        flex-direction: column;
        gap: 1rem;
        align-items: flex-start;
      }
    }

    :root {
      --bg: #08090d;
      --red: #ff2548;
      --red-deep: #6b0a1c;
      --white: #f5f4f2;
      --silver: #a4a8b2;
    }

    body {
      background-color: var(--bg);
    }

    body::before { opacity: .018; }

    .bg-mesh {
      background:
        radial-gradient(ellipse at 82% 32%, rgba(128, 10, 34, .24), transparent 42%),
        radial-gradient(ellipse at 12% 88%, rgba(64, 10, 26, .2), transparent 42%),
        #08090d;
    }

    .slash-backdrop {
      width: 40vw;
      background: linear-gradient(145deg, rgba(255, 37, 72, .12), rgba(255, 37, 72, .015));
    }

    .bg-giant-text {
      left: 60%;
      color: transparent;
      -webkit-text-stroke-color: rgba(255, 255, 255, .025);
      transform: translate(-50%, -50%) rotate(-8deg);
    }

    .app-viewport {
      width: 100%;
      padding: clamp(1.5rem, 4vw, 3.75rem);
    }

    header {
      border-bottom-color: rgba(255, 255, 255, .16);
      padding-bottom: 1.35rem;
    }

    .brand-mark { gap: .65rem; }
    .brand-jp { font-size: clamp(1.55rem, 2.7vw, 2.2rem); }
    .brand-en { color: var(--red); }

    .top-badge {
      border-color: rgba(255, 37, 72, .48);
      background: rgba(255, 37, 72, .08);
      color: #ffdce2;
      letter-spacing: .16em;
    }

    .stage-grid {
      grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr);
      gap: clamp(2.5rem, 6vw, 6rem);
      margin: clamp(3rem, 7vh, 6rem) 0;
    }

    .content-block { gap: clamp(1.6rem, 3.5vh, 2.8rem); }
    .category-kicker { color: #ff7188; letter-spacing: .22em; }

    .main-title {
      font-size: clamp(5rem, 12vw, 11rem);
      letter-spacing: -.055em;
      line-height: .78;
    }

    .title-jp {
      margin-bottom: .18em;
      font-size: .34em;
      letter-spacing: .28em;
    }

    .title-en-pill {
      padding: 0 .16em .04em;
      background: var(--red);
      color: #fff;
      border-radius: 0;
      transform: skewX(-7deg);
      box-shadow: 7px 7px 0 rgba(5, 5, 8, .8);
    }

    .record-plate {
      gap: 1.35rem;
      padding: clamp(1.2rem, 2.5vw, 2rem);
      border-color: rgba(255, 255, 255, .17);
      border-radius: 10px;
      background: linear-gradient(145deg, rgba(24, 25, 31, .96), rgba(11, 12, 16, .97));
      box-shadow: 0 24px 60px rgba(0, 0, 0, .46), inset 0 1px 0 rgba(255,255,255,.045);
      backdrop-filter: blur(14px);
    }

    .record-plate::after {
      width: 72px;
      height: 4px;
      background: var(--red);
    }

    .plate-top {
      border-bottom-color: rgba(255,255,255,.2);
      padding-bottom: 1rem;
    }

    .rank-prefix { color: #c0c3cb; font-size: .75rem; }
    .rank-num {
      font-size: clamp(3rem, 5.2vw, 4.4rem);
      background: linear-gradient(180deg, #fff 20%, #aeb2bc 100%);
      -webkit-background-clip: text;
      filter: drop-shadow(0 3px 14px rgba(255,255,255,.12));
    }

    .badge-silver {
      color: #111216;
      background: #e4e6eb;
      box-shadow: none;
    }

    .season-name { font-size: .9rem; }

    .strip-item {
      border-color: rgba(255,255,255,.13);
      border-radius: 3px;
      background: rgba(255,255,255,.055);
    }

    .strip-item.highlight {
      border-color: rgba(255,37,72,.72);
      background: rgba(255,37,72,.13);
    }

    .strip-item.highlight .k,
    .c-type { color: #ff7188; }

    .deck-row { gap: .55rem; }

    .deck-card {
      min-height: 76px;
      justify-content: center;
      border-color: rgba(255,255,255,.16);
      border-top: 2px solid var(--red);
      border-radius: 3px;
      background: #0a0b0f;
      transition: transform .2s ease, background-color .2s ease, border-color .2s ease;
    }

    .deck-card:hover {
      border-color: rgba(255,255,255,.7);
      background: #171116;
      transform: translateY(-4px);
    }

    .visual-column { min-width: 0; }

    .tilt-card {
      max-width: 560px;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 8px;
      box-shadow: 14px 14px 0 var(--red), 0 34px 80px rgba(0,0,0,.62);
      transition: transform .24s ease-out, box-shadow .25s ease;
    }

    .tilt-card:hover {
      box-shadow: 14px 14px 0 #a90c2a, 0 40px 90px rgba(0,0,0,.68);
    }

    .tilt-card img { object-position: center 38%; }

    footer {
      border-top-color: rgba(255,255,255,.16);
      mix-blend-mode: normal;
    }

    .social-btn {
      border: 1px solid rgba(255,255,255,.58);
      border-radius: 4px;
      letter-spacing: .04em;
    }

    .social-btn:hover {
      border-color: var(--red);
      background: var(--red);
      box-shadow: 0 10px 28px rgba(255,37,72,.25);
    }

    :focus-visible {
      outline: 2px solid #ff7188;
      outline-offset: 4px;
    }

    @media (max-width: 1024px) {
      .stage-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 3.5rem;
        margin: 3rem 0;
      }

      .visual-column { order: -1; }
      .tilt-card {
        max-width: min(72vw, 440px);
        box-shadow: 10px 10px 0 var(--red), 0 28px 60px rgba(0,0,0,.6);
      }

      .slash-backdrop {
        width: 100vw;
        height: 38vh;
        clip-path: polygon(0 0, 100% 0, 100% 72%, 0 100%);
      }
    }

    @media (max-width: 480px) {
      .app-viewport { padding: 1.2rem; }
      .stage-grid { gap: 2.6rem; margin: 2.5rem 0; }
      .main-title { font-size: clamp(4.5rem, 22vw, 7rem); }
      .record-plate { padding: 1.1rem; }
      .deck-row { gap: .45rem; }
      .deck-card { min-height: 72px; }
      .tilt-card {
        max-width: min(76vw, 330px);
        box-shadow: 8px 8px 0 var(--red), 0 24px 48px rgba(0,0,0,.62);
      }
      footer { flex-direction: row; align-items: center; gap: .75rem; }
      .social-btn { padding: .45rem .8rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }

    @media (max-width: 760px) {
      body::before { display: none; }

      .bg-mesh {
        background:
          radial-gradient(ellipse at 86% 20%, rgba(128, 10, 34, .2), transparent 36%),
          #08090d;
      }

      .slash-backdrop { height: 30vh; opacity: .6; }

      .app-viewport {
        min-height: 100svh;
        justify-content: flex-start;
        padding: 18px 18px max(24px, env(safe-area-inset-bottom));
      }

      header {
        gap: 12px;
        padding-bottom: 12px;
      }

      .top-badge {
        padding: 3px 0 3px 10px;
        border: 0;
        border-left: 2px solid var(--red);
        border-radius: 0;
        background: transparent;
        color: #ffc4cf;
        font-size: .6rem;
        letter-spacing: .16em;
        white-space: nowrap;
        backdrop-filter: none;
      }

      .stage-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "title"
          "visual"
          "record";
        align-items: start;
        gap: 0;
        margin: 25px 0 30px;
      }

      .content-block { display: contents; }

      .title-group {
        grid-area: title;
        gap: 5px;
        margin-bottom: 19px;
      }

      .category-kicker {
        margin-bottom: 2px;
        color: #a4a8b2;
        font-size: .62rem;
        letter-spacing: .2em;
      }

      .main-title {
        display: flex;
        align-items: baseline;
        gap: .12em;
        min-width: 0;
        font-size: clamp(4.6rem, 19vw, 7rem);
        line-height: .88;
        letter-spacing: -.06em;
        white-space: nowrap;
      }

      .title-jp {
        display: inline-block;
        margin: 0;
        font-size: .34em;
        letter-spacing: .12em;
      }

      .title-en-pill {
        padding: 0 .14em .04em;
        box-shadow: 4px 4px 0 #090a0d;
      }

      .visual-column {
        grid-area: visual;
        order: 0;
        margin-bottom: 28px;
      }

      .tilt-card {
        width: 100%;
        max-width: none;
        aspect-ratio: 1 / 1;
        border: 1px solid rgba(255,255,255,.25);
        border-radius: 12px;
        box-shadow: 6px 6px 0 var(--red), 0 24px 56px rgba(0,0,0,.5);
        transform: none !important;
        transition: none;
        cursor: default;
        touch-action: pan-y;
      }

      .tilt-card:hover {

      }

      .tilt-card img {
        object-position: center 38%;
        transition: none;
      }

      .tilt-card:hover img { transform: none; }

      .record-plate {
        grid-area: record;
        gap: 17px;
        padding: 18px;
        border: 1px solid rgba(255,255,255,.1);
        border-radius: 12px;
        background: linear-gradient(145deg, #17181d, #0d0e12 76%);
        box-shadow: 0 16px 38px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.05);
      }

      .record-plate::after { width: 58px; height: 3px; }

      .plate-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 13px;
      }

      .plate-rank { align-items: center; gap: 8px; }
      .rank-prefix { color: #ff7188; font-size: .67rem; letter-spacing: .15em; }
      .rank-num { font-size: 3.1rem; }

      .plate-season {

      }

      .badge-silver { font-size: .56rem; letter-spacing: .1em; }
      .season-name { font-size: .72rem; color: #d7d8de; }

      .spec-strip {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .strip-item {
        display: flex;
        min-width: 0;
        min-height: 46px;
        align-items: center;
        gap: 6px;

      .strip-item:nth-child(3) {
        grid-column: 1 / -1;
        border-left: 2px solid var(--red);
      }
      .strip-item .k { flex: 0 0 auto; font-size: .6rem; }

      .deck-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 1px;
      }

      .deck-card {
        min-height: 68px;
        gap: 6px;
        padding: 10px;
        border-radius: 6px;
        background: linear-gradient(145deg, #121318, #090a0d);
      }

      .c-type { font-size: .58rem; letter-spacing: .12em; }
      .c-name { font-size: .9rem; }

      footer {
        gap: 12px;
        padding-top: 16px;
        mix-blend-mode: normal;
      }

      .footer-brand { font-size: .78rem; }

      .social-btn {
        min-height: 44px;
        justify-content: center;
        padding: 8px 14px;
        font-size: .8rem;
      }
    }

    @media (max-width: 360px) {
      .app-viewport { padding-right: 14px; padding-left: 14px; }
      .stage-grid { margin-top: 21px; }
      .plate-top { align-items: flex-start; }
      .plate-season { max-width: 55%; }
      .season-name { font-size: .64rem; }
      .record-plate { padding: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tilt-card, .tilt-card img { transition: none !important; }
    }
  </style>
</head>

  <!-- 3Dチルト制御スクリプト -->
  <script>
    const card = document.getElementById('tiltCard');
    
    // PC：マウス追従の3D視差傾き
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      
      const rotateX = ((y - centerY) / centerY) * -6;
      const rotateY = ((x - centerX) / centerX) * 6;
      
      card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.01, 1.01, 1.01)`;
    });

    card.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
    });

    // モバイル：タップ時の沈み込み
    card.addEventListener('touchstart', () => {
      card.style.transform = 'perspective(1000px) scale3d(0.985, 0.985, 0.985)';
    }, { passive: true });

    card.addEventListener('touchend', () => {
      card.style.transform = 'perspective(1000px) scale3d(1, 1, 1)';
    }, { passive: true });
  </script>
